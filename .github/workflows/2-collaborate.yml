name: Step 2

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_3_FILE: ".github/steps/3-prepare-environment.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get response templates
        uses: actions/checkout@v5
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Enable next workflow and disable current one
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const nextWorkflow = '3-prepare-environment.yml';
            try {
              await github.rest.actions.getWorkflow({ owner, repo, workflow_id: nextWorkflow });
            } catch (error) {
              if (error.status !== 404) throw error;
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: `.github/workflows/${nextWorkflow}`
              });
              if (data.type !== 'file') throw error;
              core.info(`${nextWorkflow} is not registered yet; it can run on its first matching event.`);
              await github.rest.actions.disableWorkflow({ owner, repo, workflow_id: '2-collaborate.yml' });
              return;
            }
            await github.rest.actions.enableWorkflow({ owner, repo, workflow_id: nextWorkflow });
            await github.rest.actions.disableWorkflow({ owner, repo, workflow_id: '2-collaborate.yml' });
